name: Calcular losas exportadas de Revit
on:
  push:
    branches: [main, codex/memoriaplus-diseno]
    paths:
      - .github/workflows/calculo-losas.yml
      - scripts/calculo_losas.py
      - motor-fea/src/**
      - entradas-losas/proyecto.json
      - entradas-losas/usos.json
  workflow_dispatch:
    inputs:
      proyecto:
        description: "Exportación JSON de Revit en entradas-losas/ (vacío para el ejemplo sintético)"
        type: string
      usos:
        description: "JSON de usos del mismo expediente en entradas-losas/"
        type: string

permissions:
  contents: read

jobs:
  calcular:
    uses: dashy2004/CDCRD-Digital/.github/workflows/calculo-losas.yml@54988a210a0ae0fd7c8aef8c8df8631319deef94
    with:
      revision_cdcrd: 54988a210a0ae0fd7c8aef8c8df8631319deef94
      motor_del_cliente: true
      proyecto: ${{ inputs.proyecto || '' }}
      usos: ${{ inputs.usos || '' }}
