name: Calcular losas exportadas de Revit

on:
  push:
    branches: [main, codex/memoriaplus-diseno]
    paths:
      - .github/workflows/calculo-losas.yml
      - scripts/calculo_losas.py
      - motor-fea/src/**
      - entradas-losas/proyecto.json
      - entradas-losas/usos.json
  workflow_dispatch:
    inputs:
      proyecto:
        description: "Exportación JSON de Revit en entradas-losas/ (vacío para el ejemplo sintético)"
        type: string
      usos:
        description: "JSON de usos del mismo expediente en entradas-losas/"
        type: string

permissions:
  contents: read

jobs:
  calcular:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Obtener la versión del puente y del complemento
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dashy2004/CDCRD-Digital
          ref: 8340d0e3229b7e96a6d031826b56e521e7c171b7
          path: herramientas-cdcrd
          sparse-checkout: |
            puente-losas/src
            puente-losas/ejemplo
            plugin-losas/src
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Preparar el escritor de Excel
        run: python -m pip install openpyxl==3.1.5
      - name: Calcular y verificar el informe
        env:
          ARCHIVO_PROYECTO: ${{ inputs.proyecto }}
          ARCHIVO_USOS: ${{ inputs.usos }}
          DETECTAR_ENTRADAS: ${{ github.event_name == 'push' && '--detectar-entradas' || '' }}
          PYTHONPATH: motor-fea/src:herramientas-cdcrd/puente-losas/src:herramientas-cdcrd/plugin-losas/src
        run: >-
          python scripts/calculo_losas.py --puente herramientas-cdcrd
          --proyecto "$ARCHIVO_PROYECTO" --usos "$ARCHIVO_USOS"
          --salida salida-losas $DETECTAR_ENTRADAS
      - name: Descargar resultados desde el resumen de la ejecución
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calculo-losas
          retention-days: 7
          if-no-files-found: error
          path: |
            salida-losas/informe_losas.xlsx
            salida-losas/resultados.json
            salida-losas/lectura.json
            salida-losas/acero_pm.json
            salida-losas/Revision para ChatGPT.md
