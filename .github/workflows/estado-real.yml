name: estado-real

# Gate de "verdad de estado" (F8 ← F0): corre ./estado-real.sh --check, que
# (1) compila la solucion Avalonia con --no-incremental (warnings veraces),
# (2) corre ambas suites (.NET + pytest en motor-fea/.venv),
# (3) verifica que ningun doc rastreado "vivo" declare conteos de tests
#     divergentes del conteo real (los docs historicos y los superseded con
#     banner estan excluidos del check).
# Falla si una suite esta roja, el log no respalda el conteo, o un doc miente.

on:
  push:
    branches: [main, avalonia-linux]
  pull_request:
    branches: [main, avalonia-linux]
  workflow_dispatch:

jobs:
  estado-real:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # El script exige el venv en la ruta exacta motor-fea/.venv (no usa el
      # python del sistema a proposito: esa era una de las mentiras de estado).
      - name: Crear venv del motor-fea
        run: |
          python -m venv motor-fea/.venv
          motor-fea/.venv/bin/pip install -e "motor-fea[dev]"

      - name: estado-real --check
        run: ./estado-real.sh --check

      - name: Publicar STATE.md y logs como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estado-real
          path: |
            STATE.md
            build.log
            test.log
