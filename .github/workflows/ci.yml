name: ci

# LEGACY (solo manual): CI del snapshot WPF (LosasPlus.sln, windows-latest).
# Desde el port a Avalonia la solucion de verdad es LosasPlus.Linux.sln,
# cubierta por ci-linux.yml + estado-real.yml en cada push/PR. Este workflow
# se conserva ejecutable a demanda (workflow_dispatch) para validar el
# snapshot WPF historico; no corre automaticamente. Ver /STATE.md y F8 en
# docs/superpowers/roadmap-fases-F0-F9.md.

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LosasPlus.sln

      - name: Build (Release)
        run: dotnet build LosasPlus.sln -c Release --no-restore /warnaserror

      - name: Test
        run: dotnet test LosasPlus.sln -c Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 14
